[project]
name = "fundpilot"
version = "0.1.0"
description = "Modular, research-oriented framework for crypto margin-funding / stablecoin lending optimization."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "FundPilot contributors" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
]

[project.scripts]
fundpilot = "fundpilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "DTZ", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S311", "C408"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["fundpilot"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a real PostgreSQL instance (FUNDPILOT_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:fundpilot.*"]
